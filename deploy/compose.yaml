services:
  api:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/devops-cicd-lab:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      APP_MESSAGE: "Hello from Ubuntu staging!"
      APP_VERSION: ${IMAGE_TAG}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
