name: CI-CD Staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd-lab:${{ github.sha }}

  deploy:
    name: Deploy to Ubuntu Staging
    needs: build
    if: vars.STAGING_HOST != '' && vars.STAGING_USER != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy selected image tag
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${STAGING_USER}@${STAGING_HOST}" \
            "cd /opt/devops-cicd-lab && IMAGE_TAG=${DEPLOY_SHA} docker compose pull && IMAGE_TAG=${DEPLOY_SHA} docker compose up -d --no-build --wait --wait-timeout 120 && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${DEPLOY_SHA}/' .env"
